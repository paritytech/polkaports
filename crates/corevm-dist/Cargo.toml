[package]
name = "corevm-dist"
description = "CoreVM Linux distribution CLI. Downloads and installs RISCV system root and build tools."
documentation = "https://docs.rs/corevm-dist"
readme = "README.md"
keywords = ["polkavm", "corevm", "linux"]
categories = ["command-line-utilities"]
include = ["**/*.rs", "Cargo.toml", "README.md", "b2sum.txt", "env.sh"]
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
version = "0.1.0"
publish = true

[features]
default = []
reqwest = ["dep:reqwest"]

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
blake2b_simd = "1.0.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
fs = { version = "3.3.2", package = "fs-err" }
memmap2 = "0.9.11"
reqwest = { version = "0.13.5", features = ["blocking"], optional = true }
tar = { version = "0.4.46", features = [], default-features = false }
zstd = "0.14.2"
